name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag, package version and lock agree
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const tag = process.env.RELEASE_TAG;
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          if (tag !== `v${pkg.version}`) throw new Error(`tag ${tag} != v${pkg.version}`);
          if (lock.version !== pkg.version || lock.packages?.[""]?.version !== pkg.version) throw new Error("package-lock version drift");
          const patch = readFileSync("cordis.patch.yml", "utf8");
          if (!patch.includes(`host-v${pkg.version}.js`)) throw new Error("cordis.patch.yml not rebuilt for this version");
          '
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts
      - name: Attach tarball to the GitHub release
        run: gh release upload "$RELEASE_TAG" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish (trusted publishing / provenance, no token needed)
        run: |
          tag="${RELEASE_TAG#v}"
          npm_tag=$([[ "$tag" == *-* ]] && echo next || echo latest)
          npm publish ./*.tgz --access public --provenance --ignore-scripts --tag "$npm_tag"
