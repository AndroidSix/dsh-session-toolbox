<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">多引用回复示意</title><desc id="desc">虚构会话中累加整条消息与选区引用，在原生输入卡片内分别预览和取消，保留草稿及附件后正常发送。</desc>
<rect width="1120" height="660" rx="20" fill="#171717"/>
<g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#ececec">
<text x="48" y="56" font-size="24" font-weight="600">多引用回复</text><text x="48" y="88" font-size="15" fill="#a8a8a8">功能示意 · 全部使用虚构内容</text>
<rect x="220" y="128" width="740" height="76" rx="22" fill="#292929"/>
<text x="248" y="173" font-size="19">先修复登录问题，再整理界面样式。</text>
<rect x="973" y="148" width="40" height="36" rx="7" fill="#333" stroke="#888"/>
<circle cx="993" cy="166" r="10" stroke="#eee" fill="none" stroke-width="1.3"/><text x="986" y="174" font-size="20">“</text>
<text x="570" y="237" font-size="15" fill="#bbb">① 点击「引用回复」，或选中正文右键引用</text>
<rect x="96" y="274" width="928" height="300" rx="24" fill="#242424" stroke="#484848"/>
<rect x="118" y="292" width="883" height="75" rx="10" fill="#292929" stroke="#444"/>
<path d="M136 306v47" stroke="#8ba6d6" stroke-width="2"/>
<text x="151" y="319" font-size="14" fill="#aaa">1 · 引用用户消息</text><text x="151" y="346" font-size="17" fill="#ccc">先修复登录问题，再整理界面样式。</text><text x="972" y="320" font-size="23" fill="#aaa">×</text>
<rect x="118" y="375" width="883" height="75" rx="10" fill="#292929" stroke="#444"/>
<path d="M136 389v47" stroke="#8ba6d6" stroke-width="2"/>
<text x="151" y="402" font-size="14" fill="#aaa">2 · 引用助手回复（选中文字）</text><text x="151" y="429" font-size="17" fill="#ccc">登录问题已修复，界面样式待检查。</text><text x="972" y="403" font-size="23" fill="#aaa">×</text>
<text x="120" y="490" font-size="18">请结合这两条消息，检查分组菜单的样式。</text>
<text x="120" y="546" font-size="14" fill="#aaa">② 继续引用可累加 · 每条独立取消 · 保留原有草稿与附件</text>
<circle cx="976" cy="538" r="21" fill="#e8e8e8"/><path d="M976 547v-18m-7 7 7-7 7 7" stroke="#222" fill="none" stroke-width="2"/>
<text x="96" y="619" font-size="15" fill="#aaa">③ 正常发送；各引用独立展示，原文与新问题一同提交。</text>
</g></svg>
